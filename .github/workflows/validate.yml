name: Validate PMHub

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate plugin and skills
        run: python3 tools/validate_repo.py
      - name: Validate resume template JavaScript
        run: |
          node --check skills/pmhub-ai-native-resume/assets/template/resume-data.js
          node --check skills/pmhub-ai-native-resume/assets/template/script.js
